<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 4K Image Upscaler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #09090b; color: #f4f4f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .container { width: 100%; max-width: 600px; background: #18181b; padding: 32px; border-radius: 16px; border: 1px solid #27272a; text-align: center; }
    h1 { font-size: 1.75rem; margin-bottom: 8px; }
    p { color: #a1a1aa; font-size: 0.95rem; margin-bottom: 24px; }
    
    .upload-box { border: 2px dashed #3f3f46; border-radius: 12px; padding: 40px 20px; cursor: pointer; transition: border-color 0.2s; margin-bottom: 20px; }
    .upload-box:hover { border-color: #a855f7; }
    input[type="file"] { display: none; }
    
    .btn { background: #a855f7; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; width: 100%; }
    .btn:hover { background: #9333ea; }
    .btn:disabled { background: #3f3f46; cursor: not-allowed; }

    .status { margin-top: 16px; font-size: 0.9rem; color: #a1a1aa; }
    
    .preview-container { margin-top: 24px; display: none; flex-direction: column; gap: 16px; }
    img { width: 100%; max-height: 400px; object-fit: contain; border-radius: 8px; border: 1px solid #27272a; }
  </style>
</head>
<body>

  <div class="container">
    <h1>AI 4K Image Upscaler</h1>
    <p>Enhance low-resolution or blurry images automatically using Real-ESRGAN AI.</p>

    <div class="upload-box" onclick="document.getElementById('file-input').click()">
      <h3 id="upload-label">Click to Upload Image</h3>
    </div>
    <input type="file" id="file-input" accept="image/*">

    <button class="btn" id="upscale-btn" disabled>Enhance to 4K</button>
    <div class="status" id="status-text"></div>

    <div class="preview-container" id="preview-container">
      <h3>Result:</h3>
      <img id="result-img" src="" alt="Upscaled Result">
      <a id="download-link" download="upscaled-4k.png">
        <button class="btn" style="background:#22c55e;">Download 4K Image</button>
      </a>
    </div>
  </div>

  <script>
    const VERCEL_BACKEND_URL = "https://imageupscaler-rouge.vercel.app/"; // Replace with your Vercel URL

    const fileInput = document.getElementById('file-input');
    const uploadLabel = document.getElementById('upload-label');
    const upscaleBtn = document.getElementById('upscale-btn');
    const statusText = document.getElementById('status-text');
    const previewContainer = document.getElementById('preview-container');
    const resultImg = document.getElementById('result-img');
    const downloadLink = document.getElementById('download-link');

    let base64Image = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      uploadLabel.textContent = `Selected: ${file.name}`;
      
      const reader = new FileReader();
      reader.onload = () => {
        base64Image = reader.result;
        upscaleBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    });

    upscaleBtn.addEventListener('click', async () => {
      if (!base64Image) return;

      upscaleBtn.disabled = true;
      statusText.textContent = "Processing image with AI... (this takes ~5-15s)";
      previewContainer.style.display = 'none';

      try {
        const response = await fetch(VERCEL_BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imageBase64: base64Image })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        resultImg.src = data.upscaledImage;
        downloadLink.href = data.upscaledImage;
        previewContainer.style.display = 'flex';
        statusText.textContent = "Upscaling Complete!";
      } catch (err) {
        statusText.textContent = `Error: ${err.message}`;
      } finally {
        upscaleBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
